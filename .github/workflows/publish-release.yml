name: Release on Tag
on:
  push:
    tags:
      - '*'
      - '!prerelease-*'

jobs:
  build:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Releases ship the latest stable proot-next release, built before the release is created so a failed ingest publishes nothing
    - run: bash ci-scripts/create-releases.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PROOT_CHANNEL: release
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body_path: release-notes/current
        draft: false
        prerelease: false
    - uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: proot-apps-*
        tag: ${{ github.ref }}
        overwrite: true
        file_glob: true
