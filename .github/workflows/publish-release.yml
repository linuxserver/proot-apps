name: Release on Tag
on:
  push:
    tags:
      - '*'
      - '!prerelease-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to create, for example 0.5.5'
        required: true
        type: string
      ingest_proot:
        description: 'Only ingest the latest stable proot-next with generated notes, fails if the packaged files changed since the last release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Publish Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
      INGEST_PROOT: ${{ inputs.ingest_proot && 'true' || 'false' }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          if ! [[ "${RELEASE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version ${RELEASE_TAG} is not in the form 0.0.0"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/${RELEASE_TAG} >/dev/null; then
            echo "Tag ${RELEASE_TAG} already exists"
            exit 1
          fi
        fi
        if [ "${INGEST_PROOT}" == "true" ]; then
          LAST_RELEASE=$(gh api repos/${GITHUB_REPOSITORY}/releases/latest -q .tag_name)
          if ! git diff --quiet ${LAST_RELEASE} HEAD -- proot-apps ci-scripts/create-releases.sh; then
            echo "Packaged files changed since ${LAST_RELEASE}, release with the proot-next option unchecked instead"
            git diff --stat ${LAST_RELEASE} HEAD -- proot-apps ci-scripts/create-releases.sh
            exit 1
          fi
          echo "Releasing ${LAST_RELEASE} with the latest stable proot-next as ${RELEASE_TAG}"
        fi
    # Releases ship the latest stable proot-next release, built before the release is created so a failed ingest publishes nothing
    - id: build
      run: bash ci-scripts/create-releases.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PROOT_CHANNEL: release
    - id: notes
      run: |
        if [ "${INGEST_PROOT}" == "true" ]; then
          PROOT_TAG=${{ steps.build.outputs.proot_tag }}
          {
            printf 'Bugfix update:\n\n'
            printf '* Ingest proot-next [%s](https://github.com/selkies-project/proot-next/releases/tag/%s)\n\n' "${PROOT_TAG}" "${PROOT_TAG}"
            gh release view ${PROOT_TAG} -R selkies-project/proot-next --json body -q .body
          } > ${RUNNER_TEMP}/release-notes
        else
          cp release-notes/current ${RUNNER_TEMP}/release-notes
        fi
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        release_name: Release ${{ env.RELEASE_TAG }}
        commitish: ${{ github.sha }}
        body_path: ${{ runner.temp }}/release-notes
        draft: false
        prerelease: false
    - uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: proot-apps-*
        tag: ${{ env.RELEASE_TAG }}
        overwrite: true
        file_glob: true
