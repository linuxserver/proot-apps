name: Prerelease on Commit

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  prerelease:
    name: Publish Prerelease
    runs-on: ubuntu-latest
    # Package and README bot commits are not releases
    if: >-
      github.event.head_commit.author.name != 'Package Bot' &&
      github.event.head_commit.author.name != 'README Bot' &&
      !startsWith(github.event.head_commit.message, 'Bot Updating')
    steps:
    - uses: actions/checkout@v4
    # Prereleases ship the proot-next build of the latest commit to its main branch
    - id: build
      run: bash ci-scripts/create-releases.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PROOT_CHANNEL: prerelease
    - uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: proot-apps-*
        tag: prerelease-${{ github.sha }}
        release_name: Prerelease ${{ github.sha }}
        body: |
          ${{ github.event.head_commit.message }}

          proot-next: https://github.com/selkies-project/proot-next/releases/tag/${{ steps.build.outputs.proot_tag }}
        prerelease: true
        overwrite: true
        file_glob: true
